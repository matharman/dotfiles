InlayHints:
  Enabled: Yes
  ParameterNames: Yes
  DeducedTypes: Yes

Diagnostics:
  UnusedIncludes: Strict

CompileFlags:
  Remove:
    - "-fanalyzer"

---
If:
  PathMatch:
    [
      /home/mharman/work/zephyr-tracker/.*,
      /home/mharman/work/zephyr-tracker-root/.*,
      /home/mharman/m2md/zephyr-tracker-root/.*,
      /opt/ncs/.*,
      /home/mharman/work/esp-idf/.*,
      /home/mharman/work/esp-wifi-scan/.*,
      /home/mharman/raven/.*,
      /home/mharman/flock/raven/.*,
      /home/mharman/flock/flock-stm32g0-picard-power-module/.*,
      /home/mharman/flock/trapperkeeper/.*,
      /opt/esp/.*,
    ]

CompileFlags:
  Remove:
    - "-f*"
    - "-m*"

---
If:
  PathMatch:
    [
      /home/mharman/flock/trapperkeeper/.*,
    ]

CompileFlags:
  Remove:
    - "-f*"
    - "-m*"
    - "-enable-trivial*"

---
If:
  PathMatch: '.*\.(asm|s|S)'

Index:
  # Applies only to the assembly files matched above. Skip keeps their
  # symbols out of the background index, so go-to-definition will not
  # reach symbols defined in them. All other files keep the default (Build).
  Background: Skip
