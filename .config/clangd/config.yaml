InlayHints:
  Enabled: Yes
  ParameterNames: Yes
  DeducedTypes: Yes

Diagnostics:
  UnusedIncludes: Strict

---
If:
  PathMatch: '.*\.(asm|s|S)'

Index:
  # Applies only to the assembly files matched above. Skip keeps their
  # symbols out of the background index, so go-to-definition will not
  # reach symbols defined in them. All other files keep the default (Build).
  Background: Skip
