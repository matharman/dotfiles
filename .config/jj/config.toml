#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Mathew Harman"
email = "mathew.harman@gmail.com"

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'

[aliases]
dt = ["diffedit", "--tool=nvimdifftool"]
tug = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
log-mine = ["log", "--revision", "trunk():: & mine()"]

[fix.tools.clang-format]
command = ["clang-format", "--assume-filename=$path"]
patterns = ["glob:**/*.c", "glob:**/*.cpp", "glob:**/*.h", "glob:**/*.hpp"]

[ui]
editor = "nvim"
diff-editor = "hunknvim"
diff-instructions = false

[merge-tools.jj-stage]
program = "nvim"
edit-args = ["-c", "let g:autoformat=v:false", "-c", "JJDiffStage $left $right"]

[merge-tools.nvimdifftool]
program = "nvim"
edit-args = ["-c", "let g:autoformat=v:false", "-c", "packadd nvim.difftool", "-c", "DiffTool $left $right"]

[merge-tools.hunknvim]
program = "nvim"
edit-args = ["-c", "let g:autoformat=v:false", "-c", "packadd nvim.difftool", "-c", "DiffEditor $left $right $output"]

[signing]
behavior = "own"
backend = "gpg"
key = "D5A9E07E5740AA47"
